# Railway — config as code. Docs: https://docs.railway.com/reference/config-as-code
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt trên Railway, không ghi ở đây.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Không có startCommand: dùng CMD của Dockerfile, đã nghe theo $PORT do Railway cấp
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

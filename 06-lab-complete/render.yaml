# Render Blueprint — agent (Docker) + Key Value (Redis). Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        sync: false          # nhập tay trên dashboard, không commit giá trị
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []          # chỉ cho service trong cùng tài khoản Render truy cập
